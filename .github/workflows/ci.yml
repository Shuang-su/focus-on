name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: bash scripts/bootstrap.sh check
      - run: bash scripts/bootstrap.sh focus doctor
      - run: bash scripts/bootstrap.sh focus plan --request examples/requests/create-task.json --vault examples/vault --out .codex-work/tmp/handoff
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-handoff
          path: .codex-work/tmp/handoff
          retention-days: 7
